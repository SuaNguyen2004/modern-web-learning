<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Học Tailwind CSS & JS ES6+</title>

        <!-- Nhúng Tailwind CSS CDN (Cách đơn giản nhất để bắt đầu) -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 min-h-screen p-6 font-sans">
        <!-- Container chính giữa màn hình -->
        <div class="max-w-2xl mx-auto space-y-6">
            <!-- Tiêu đề trang -->
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-blue-600">🚀 Lộ Trình Web Developer Hiện Đại</h1>
                <p class="text-red-600 mt-2">Thực hành Tailwind CSS & JavaScript ES6+</p>
            </div>

            <!-- THẺ DỰ ÁN 1: Thẻ thông tin cá nhân (Card) làm bằng Tailwind CSS -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">👤 Thông Tin Học Viên</h2>

                <div class="space-y-3">
                    <p class="text-gray-700">
                        <strong>Họ và tên:</strong>
                        Sửa Nguyễn
                    </p>
                    <p class="text-gray-700">
                        <strong>Mục tiêu:</strong>
                        Từ PHP/MySQL thuần lên Full-Stack Developer
                    </p>

                    <!-- Các nhãn kỹ năng (Badges) -->
                    <div class="flex flex-wrap gap-2 pt-2">
                        <span class="bg-red-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">
                            HTML/CSS
                        </span>
                        <span class="bg-purple-100 text-purple-800 text-xs font-semibold px-3 py-1 rounded-full">
                            PHP & MySQL
                        </span>
                        <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">
                            Git & GitHub
                        </span>
                        <span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-3 py-1 rounded-full">
                            JS ES6+
                        </span>
                        <span class="bg-cyan-100 text-cyan-800 text-xs font-semibold px-3 py-1 rounded-full">
                            Tailwind CSS (New!)
                        </span>
                    </div>
                </div>
            </div>

            <!-- THẺ DỰ ÁN 2: Dữ liệu API (Do main.js render) -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">
                    🌐 Dữ Liệu Gọi Từ API (JS Async/Await)
                </h2>
                <div id="app"></div>
            </div>
        </div>

        <!-- Nhúng file JavaScript -->
        <script src="js/main.js"></script>
    </body>
</html>
